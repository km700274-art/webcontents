<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>transition</title>
        <style>
            img {
                
                transition: width 2s;
            }

            img:hover {
                width: 100%;
            }
        </style>
    </head>
    <body>
        <h2>마우스를 올려봐요</h2>
        <hr>
        <img src="media/스폰지밥.png" width="100px" height="100px" alt="스폰지밥 이미지">
    </body>
</html>

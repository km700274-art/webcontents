<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>애니메이션</title>
        <style>
            img {
                width: 150px;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <h2>어지러워요</h2>
        <hr>
        <img src="media/스폰지밥.png" alt="회전 이미지">
    </body>
</html>

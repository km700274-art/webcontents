<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>설문지 만들기</title>
    <link rel="stylesheet" href="설문지.css">
</head>
<body>
    <header>
        <h3>설문지</h3>
        <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
        <hr>
    </header>

    <nav>
        <p>학년, 성별, 관심 분야, 진로, 하고 싶은 말을 입력하는 설문 페이지입니다.</p>
    </nav>

    <section>
        <form>
            <label>
                학년 <input type="radio" name="학년" value="1">
                1학년
            </label>
            <label>
                <input type="radio" name="학년" value="2" checked>
                2학년
            </label>
            <label>
                <input type="radio" name="학년" value="3">
                3학년
            </label>
            <br><br>

            <label>성별</label>
            <input type="radio" name="성별" value="1" checked>
            <label>남성</label>
            <input type="radio" name="성별" value="2">
            <label>여성</label>
            <br><br>

            관심 분야
            <select name="관심분야">
                <option value="프로그래밍">모바일 소프트웨어</option>
                <option value="인공지능" selected>인공지능</option>
                <option value="빅데이터">빅데이터</option>
            </select>
            <br><br>

            진로
            <label>
                개발<input type="checkbox" name="개발" value="1">
            </label>
            <label>
                기획<input type="checkbox" name="기획" value="2" checked>
            </label>
            <label>
                영업<input type="checkbox" name="영업" value="3">
            </label>
            <label>
                창업<input type="checkbox" name="창업" value="4">
            </label>
            <br><br>

            남기고 싶은 말
            <br>
            <textarea name="남기고싶은말" rows="8" cols="50" placeholder="글을 남겨주세요."></textarea>
        </form>
    </section>

    <footer>
        <hr>
        <p>Copyright 2026 by MYONGJI COLLEGE</p>
    </footer>
</body>
</html>
